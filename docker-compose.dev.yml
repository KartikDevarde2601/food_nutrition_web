# docker-compose.dev.yml (Development)
version: '3.8'

services:
  web:
    container_name: food_nutrition_web_dev
    build:
      context: .
      dockerfile: Dockerfile.dev

    ports:
      - "5173:5173"

    volumes:
      # Mount source code - changes reflect instantly
      - .:/app
      # Anonymous volume for node_modules
      # WHY? Prevents host's node_modules from overriding container's
      - /app/node_modules

    # ✅ Load .env file at runtime
    # WHY env_file?
    # - .dockerignore excludes .env for security
    # - env_file loads it at container STARTUP (not build time)
    # - Vite dev server reads VITE_* vars from process.env
    env_file:
      - .env

    environment:
      # Polling for file watching in Docker
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

    stdin_open: true
    tty: true